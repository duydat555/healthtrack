name: Regen golden (tạm)
on:
  workflow_dispatch:
  push:
    branches: ["feat/183-he-thong-thiet-ke-moi"]
jobs:
  regen:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.9"
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test --update-goldens test/foundation_widgets_test.dart
      - uses: actions/upload-artifact@v4
        with:
          name: goldens
          path: mobile/test/goldens/
