name: Backend CI

on:
  workflow_dispatch:
  # Chạy trên mọi PR (không lọc đường dẫn) để check bắt buộc của branch protection luôn có kết quả
  pull_request:
  push:
    branches: [main]
    paths: ["backend/**"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - name: Run tests and enforce backend coverage
        run: pytest -q --cov=app --cov-report=term-missing --cov-report=xml --cov-fail-under=70
      - name: Add coverage report to job summary
        if: always()
        run: coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"
      - run: >-
          coverage report
          --include=app/services/weight.py,app/services/water.py,app/services/sleep.py
          --fail-under=80
