name: Backend CI

on:
  workflow_dispatch:
  # Chạy trên mọi PR (không lọc đường dẫn) để check bắt buộc của branch protection luôn có kết quả
  pull_request:
  push:
    branches: [main]
    paths: ["backend/**"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q --cov=app --cov-report=term-missing
