name: Mobile CI

on:
  workflow_dispatch:
  # Chạy trên mọi PR để check bắt buộc của branch protection luôn có kết quả
  pull_request:
  push:
    branches: [main]
    paths: ["mobile/**"]

jobs:
  analyze-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get

      # TẠM THỜI: tạo golden trên Ubuntu giống môi trường CI
      - name: Regenerate foundation widget goldens
        run: flutter test --update-goldens test/foundation_widgets_test.dart
      - name: Upload foundation widget goldens
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: foundation-widget-goldens
          path: mobile/test/goldens/foundation_widgets_*.png

      - run: dart format --output=none --set-exit-if-changed lib test integration_test packages/liquid_glass/lib packages/liquid_glass/test
      - run: flutter analyze
      - run: flutter test
      - name: Test plugin liquid_glass
        working-directory: mobile/packages/liquid_glass
        run: flutter pub get && flutter test

  build-ios:
    # Build iOS (gồm mã Swift Liquid Glass) chỉ chạy khi merge vào main để tiết kiệm phút macOS
    if: github.event_name == 'push'
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build ios --simulator --no-codesign