name: activity_sensors
description: "Đếm bước chân và lấy các quãng nghỉ từ cảm biến của máy (CoreMotion trên iOS, cảm biến đếm bước và lịch sử màn hình trên Android), không cần Apple Health"
version: 0.0.1
publish_to: none

environment:
  sdk: ^3.13.7
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: vn.edu.vku.healthtrack.activity_sensors
        pluginClass: ActivitySensorsPlugin
      ios:
        pluginClass: ActivitySensorsPlugin
