name: health_bridge
description: "Đọc dữ liệu Apple Health (HealthKit) cho HealthTrack"
version: 0.0.1
publish_to: none

environment:
  sdk: ^3.13.7
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      ios:
        pluginClass: HealthBridgePlugin
